# Nginx sample for PersonalBlogWeb (Docsify + AGVS HTML courses)
#
# Usage on the production server (e.g. 121.40.143.58):
#   1. Clone/pull this repo to a path such as /var/www/PersonalBlogWeb
#   2. Copy this file to /etc/nginx/sites-available/personal-blog
#   3. Edit `root` / `server_name` below if needed
#   4. sudo ln -sf /etc/nginx/sites-available/personal-blog /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# You do NOT need a separate location block for 6_AGVSinAction.
# As long as `root` points at the repo, /6_AGVSinAction/*.html is served as static files.

server {
    listen 80;
    listen [::]:80;
    # Replace with your domain or keep the IP
    server_name 121.40.143.58;

    # IMPORTANT: must be the repository root that contains index.html and 6_AGVSinAction/
    root /var/www/PersonalBlogWeb;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # Prefer real files/directories (AGVS HTML courses, images, md assets),
    # then fall back to Docsify SPA shell for hash-routed notes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit HTML/static types (optional but helpful)
    location ~* \.(html|css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Do not expose git / editor metadata
    location ~ /\.(git|idea|vscode) {
        deny all;
    }

    # Optional HTTPS (uncomment after certbot):
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
}
